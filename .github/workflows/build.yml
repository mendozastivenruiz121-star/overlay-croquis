name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q OverlayCroquis.zip
      - name: Configurar AndroidX
        run: |
          echo "android.useAndroidX=true" >> OverlayCroquis/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> OverlayCroquis/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        working-directory: OverlayCroquis
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OverlayCroquis-apk
          path: OverlayCroquis/app/build/outputs/apk/debug/app-debug.apk
